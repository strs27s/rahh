<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Challenge 3</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        .container { background-color: white; padding: 2rem; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        a { display: inline-block; margin-top: 1rem; }
        .admin-panel { border: 2px solid #ff4d4d; padding: 1rem; margin-top: 1rem; background-color: #ffebeb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Dashboard, {{username}}!</h1>
        <hr>
        <div class="content">
            {{admin_content}}
        </div>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
